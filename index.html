<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyNameFinder India | Meaningful & Verified Names</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-100 py-6 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-2xl sm:text-3xl font-bold text-indigo-600">BabyNameFinder India</h1>
                <p class="text-slate-500 text-sm mt-0.5">Discover meaningful names, cultural roots, and smart parent filters.</p>
            </div>
            <div class="flex gap-2">
                <button onclick="switchTab('all')" id="allTabBtn" class="px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white shadow-sm transition-all">All Names</button>
                <button onclick="switchTab('favorites')" id="favTabBtn" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">❤️ Favorites (<span id="favCount">0</span>)</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8">
        
        <!-- Advanced Parent Filters Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-8 space-y-5">
            <div>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by name or exact meaning (e.g., 'Peace', 'Light', 'Wisdom')..." 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700 text-sm sm:text-base"
                    oninput="filterNames()"
                >
            </div>
            
            <!-- Multi-Filter Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2 border-t border-slate-100">
                <!-- 1. Gender Filter -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">1. Gender Clarity</label>
                    <div class="flex flex-wrap gap-1.5">
                        <button onclick="setGenderFilter('all')" class="gender-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition-all">All</button>
                        <button onclick="setGenderFilter('Boy')" class="gender-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Boys</button>
                        <button onclick="setGenderFilter('Girl')" class="gender-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Girls</button>
                        <button onclick="setGenderFilter('Unisex')" class="gender-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Unisex</button>
                    </div>
                </div>

                <!-- 2. Cultural Roots Filter -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">2. Cultural / Linguistic Root</label>
                    <div class="flex flex-wrap gap-1.5">
                        <button onclick="setOriginFilter('all')" class="origin-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition-all">All Roots</button>
                        <button onclick="setOriginFilter('Sanskrit')" class="origin-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Sanskrit</button>
                        <button onclick="setOriginFilter('Arabic')" class="origin-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Arabic / Urdu</button>
                        <button onclick="setOriginFilter('Tamil')" class="origin-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Tamil / Regional</button>
                    </div>
                </div>

                <!-- 3. Name Length (Minimalist / Crisp Appeal) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">3. Name Length (Letters)</label>
                    <div class="flex flex-wrap gap-1.5">
                        <button onclick="setLengthFilter('all')" class="length-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition-all">Any Length</button>
                        <button onclick="setLengthFilter('short')" class="length-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Short (3-5 letters)</button>
                        <button onclick="setLengthFilter('long')" class="length-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Long (6+ letters)</button>
                    </div>
                </div>
            </div>

            <!-- Alphabet Quick Filter Bar -->
            <div class="pt-3 border-t border-slate-100">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">4. Starting Letter (A to Z)</label>
                <div id="alphabetBar" class="flex flex-wrap gap-1">
                    <button onclick="filterByLetter('all')" class="letter-btn px-2.5 py-1 rounded text-xs font-bold bg-indigo-600 text-white">All</button>
                    <!-- Injected via JS -->
                </div>
            </div>

            <div class="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-slate-100">
                <span id="activeFilterSummary">Showing all matching entries</span>
                <span class="font-medium text-slate-600">Total Results: <span id="nameCount">0</span></span>
            </div>
        </div>

        <!-- Names Grid -->
        <div id="namesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Dynamic Cards Populated via JS -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <p class="text-slate-400 text-lg">No matching baby names found. Try relaxing your filter criteria.</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-100 py-6 text-center text-sm text-slate-400">
        <p>&copy; 2026 BabyNameFinder India. Built with care for parents.</p>
    </footer>

    <!-- JavaScript Data & Application Logic -->
    <script>
        const babyNames = [
            { name: "Aarav", gender: "Boy", origin: "Sanskrit", meaning: "Peaceful, calm, or wise" },
            { name: "Aadhya", gender: "Girl", origin: "Sanskrit", meaning: "First power, Goddess Durga, or unmatched" },
            { name: "Aayan", gender: "Boy", origin: "Sanskrit", meaning: "Gift of God or path" },
            { name: "Aanya", gender: "Girl", origin: "Sanskrit", meaning: "Grace, gracious, or limitless" },
            { name: "Advait", gender: "Boy", origin: "Sanskrit", meaning: "Unique, non-dual, or focused" },
            { name: "Ananya", gender: "Girl", origin: "Sanskrit", meaning: "Matchless, unique, or peerless" },
            { name: "Atharv", gender: "Boy", origin: "Sanskrit", meaning: "Knowledge, sacred Vedas" },
            { name: "Aahana", gender: "Girl", origin: "Sanskrit", meaning: "First rays of the sun" },
            { name: "Bhavin", gender: "Boy", origin: "Sanskrit", meaning: "Living, existing, or winner" },
            { name: "Bhavya", gender: "Girl", origin: "Sanskrit", meaning: "Grand, splendid, or auspicious" },
            { name: "Bodhi", gender: "Boy", origin: "Sanskrit", meaning: "Enlightenment, awakening" },
            { name: "Bhumika", gender: "Girl", origin: "Sanskrit", meaning: "Earth, foundation, or role" },
            { name: "Charit", gender: "Boy", origin: "Sanskrit", meaning: "Character, history, or good behavior" },
            { name: "Charvi", gender: "Girl", origin: "Sanskrit", meaning: "Beautiful lady or gorgeous" },
            { name: "Chetan", gender: "Boy", origin: "Sanskrit", meaning: "Conscious spirit, life, or alert" },
            { name: "Chitra", gender: "Girl", origin: "Sanskrit", meaning: "Picture, bright, or a star" },
            { name: "Darsh", gender: "Boy", origin: "Sanskrit", meaning: "Sight, vision, or Lord Krishna" },
            { name: "Diya", gender: "Girl", origin: "Sanskrit", meaning: "Light, lamp, or brilliance" },
            { name: "Daksh", gender: "Boy", origin: "Sanskrit", meaning: "Capable, talented, or sincere" },
            { name: "Dhriti", gender: "Girl", origin: "Sanskrit", meaning: "Courage, patience, or determination" },
            { name: "Eshaan", gender: "Boy", origin: "Sanskrit", meaning: "Lord Shiva, northeast direction" },
            { name: "Esha", gender: "Girl", origin: "Sanskrit", meaning: "Desire, wish, or purity" },
            { name: "Farhan", gender: "Boy", origin: "Arabic", meaning: "Happy, joyful, or cheerful" },
            { name: "Falguni", gender: "Girl", origin: "Sanskrit", meaning: "Born in the Hindu month of Falgun" },
            { name: "Gaurav", gender: "Boy", origin: "Sanskrit", meaning: "Pride, honor, or respect" },
            { name: "Gauri", gender: "Girl", origin: "Sanskrit", meaning: "Fair complexioned, Goddess Parvati" },
            { name: "Harsh", gender: "Boy", origin: "Sanskrit", meaning: "Happiness, joy, or delight" },
            { name: "Hiya", gender: "Girl", origin: "Sanskrit", meaning: "Heart or soul" },
            { name: "Ishaan", gender: "Boy", origin: "Sanskrit", meaning: "Sun or Lord Shiva" },
            { name: "Ira", gender: "Girl", origin: "Sanskrit", meaning: "Earth, Goddess Saraswati" },
            { name: "Jai", gender: "Boy", origin: "Sanskrit", meaning: "Victory, triumph" },
            { name: "Jiya", gender: "Girl", origin: "Sanskrit", meaning: "Heart, sweetheart, or living" },
            { name: "Kian", gender: "Boy", origin: "Arabic", meaning: "Ancient king or grace of God" },
            { name: "Kavya", gender: "Girl", origin: "Sanskrit", meaning: "Poetry in motion, epic poem" },
            { name: "Laksh", gender: "Boy", origin: "Sanskrit", meaning: "Target, aim, or destination" },
            { name: "Laasya", gender: "Girl", origin: "Sanskrit", meaning: "Graceful dance by Goddess Parvati" },
            { name: "Madhav", gender: "Boy", origin: "Sanskrit", meaning: "Sweet like honey, Lord Krishna" },
            { name: "Mahi", gender: "Girl", origin: "Sanskrit", meaning: "Earth, world, or great stream" },
            { name: "Naksh", gender: "Boy", origin: "Sanskrit", meaning: "Moon, feature, or sketch" },
            { name: "Navya", gender: "Girl", origin: "Sanskrit", meaning: "New, modern, or praise-worthy" },
            { name: "Ojas", gender: "Boy", origin: "Sanskrit", meaning: "Vigour, energy, brilliance" },
            { name: "Oviya", gender: "Girl", origin: "Tamil", meaning: "Artist, beautiful drawing" },
            { name: "Pranav", gender: "Boy", origin: "Sanskrit", meaning: "Sacred syllable Om, holy sound" },
            { name: "Prisha", gender: "Girl", origin: "Sanskrit", meaning: "Beloved, loving, God's gift" },
            { name: "Qadir", gender: "Boy", origin: "Arabic", meaning: "Powerful, capable, dynamic" },
            { name: "Quinn", gender: "Unisex", origin: "Arabic", meaning: "Wise, intelligence" },
            { name: "Reyansh", gender: "Boy", origin: "Sanskrit", meaning: "Ray of light, part of Vishnu" },
            { name: "Riya", gender: "Girl", origin: "Sanskrit", meaning: "Singer, graceful, flow of music" },
            { name: "Vihaan", gender: "Boy", origin: "Sanskrit", meaning: "Dawn, morning, ray of sunshine" },
            { name: "Saanvi", gender: "Girl", origin: "Sanskrit", meaning: "Goddess Lakshmi, followed" },
            { name: "Tejas", gender: "Boy", origin: "Sanskrit", meaning: "Radiance, brilliance, sharpness" },
            { name: "Tanvi", gender: "Girl", origin: "Sanskrit", meaning: "Delicate, beautiful, slender" },
            { name: "Utkarsh", gender: "Boy", origin: "Sanskrit", meaning: "Excellence, progress, prosperity" },
            { name: "Urvi", gender: "Girl", origin: "Sanskrit", meaning: "Earth, broad, wide" },
            { name: "Vivaan", gender: "Boy", origin: "Sanskrit", meaning: "Full of life, lively" },
            { name: "Vanya", gender: "Girl", origin: "Sanskrit", meaning: "Gracious gift of God, forest" },
            { name: "Waman", gender: "Boy", origin: "Sanskrit", meaning: "Short, fifth avatar of Lord Vishnu" },
            { name: "Warda", gender: "Girl", origin: "Arabic", meaning: "Rose" },
            { name: "Xavier", gender: "Boy", origin: "Sanskrit", meaning: "Bright, new house" },
            { name: "Xanthe", gender: "Girl", origin: "Sanskrit", meaning: "Yellow, golden" },
            { name: "Yash", gender: "Boy", origin: "Sanskrit", meaning: "Fame, success, glory" },
            { name: "Yamini", gender: "Girl", origin: "Sanskrit", meaning: "Night" },
            { name: "Zayn", gender: "Boy", origin: "Arabic", meaning: "Beauty, grace, handsome" },
            { name: "Zoya", gender: "Girl", origin: "Arabic", meaning: "Alive, loving, radiant, life" }
        ];

        let currentGender = 'all';
        let currentOrigin = 'all';
        let currentLength = 'all';
        let currentLetter = 'all';
        let currentTab = 'all';
        let favorites = JSON.parse(localStorage.getItem('baby_favorites')) || [];

        function initAlphabetBar() {
            const bar = document.getElementById('alphabetBar');
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            
            alphabet.forEach(letter => {
                const btn = document.createElement('button');
                btn.className = "letter-btn px-2.5 py-1 rounded text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";
                btn.textContent = letter;
                btn.onclick = () => filterByLetter(letter);
                bar.appendChild(btn);
            });
        }

        function renderNames(list) {
            const grid = document.getElementById('namesGrid');
            const emptyState = document.getElementById('emptyState');
            const countSpan = document.getElementById('nameCount');
            
            grid.innerHTML = '';
            countSpan.textContent = list.length;
            document.getElementById('favCount').textContent = favorites.length;

            if (list.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-all flex flex-col justify-between";
                
                const badgeColor = item.gender === 'Boy' ? 'bg-blue-50 text-blue-600' : item.gender === 'Girl' ? 'bg-pink-50 text-pink-600' : 'bg-purple-50 text-purple-600';
                const isFav = favorites.some(fav => fav.name === item.name);
                const heartClass = isFav ? "text-red-500 fill-red-500" : "text-slate-300 hover:text-red-400";

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-[10px] font-bold text-indigo-500 uppercase tracking-wider">${item.name.length} letters • ${item.origin}</span>
                                <h3 class="text-xl font-bold text-slate-800">${item.name}</h3>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs px-2.5 py-1 rounded-full font-medium ${badgeColor}">${item.gender}</span>
                                <button onclick="toggleFavorite('${item.name}')" class="p-1 rounded-full bg-slate-50 hover:bg-slate-100 transition-colors">
                                    <svg class="w-5 h-5 ${heartClass} transition-colors" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <p class="text-slate-600 text-sm mb-3">${item.meaning}</p>
                    </div>
                    <div class="text-xs text-slate-400 border-t border-slate-50 pt-2 flex justify-between items-center">
                        <span>Root: <strong class="text-slate-600">${item.origin}</strong></span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterNames() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            let sourceList = currentTab === 'favorites' ? favorites : babyNames;
            
            const filtered = sourceList.filter(item => {
                const matchesGender = currentGender === 'all' || item.gender === currentGender;
                const matchesOrigin = currentOrigin === 'all' || item.origin.toLowerCase().includes(currentOrigin.toLowerCase());
                
                let matchesLength = true;
                if (currentLength === 'short') matchesLength = item.name.length >= 3 && item.name.length <= 5;
                if (currentLength === 'long') matchesLength = item.name.length >= 6;

                const matchesLetter = currentLetter === 'all' || item.name.toUpperCase().startsWith(currentLetter);
                const matchesSearch = item.name.toLowerCase().includes(query) || 
                                      item.meaning.toLowerCase().includes(query) || 
                                      item.origin.toLowerCase().includes(query);
                
                return matchesGender && matchesOrigin && matchesLength && matchesLetter && matchesSearch;
            });

            document.getElementById('activeFilterSummary').textContent = 
                `Filters active: Gender (${currentGender}), Root (${currentOrigin}), Length (${currentLength}), Letter (${currentLetter})`;

            renderNames(filtered);
        }

        function setGenderFilter(gender) {
            currentGender = gender;
            document.querySelectorAll('.gender-btn').forEach(btn => {
                if (btn.textContent.toLowerCase().includes(gender.toLowerCase()) || (gender === 'all' && btn.textContent === 'All')) {
                    btn.className = "gender-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition-all";
                } else {
                    btn.className = "gender-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";
                }
            });
            filterNames();
        }

        function setOriginFilter(origin) {
            currentOrigin = origin;
            document.querySelectorAll('.origin-btn').forEach(btn => {
                if (btn.textContent.toLowerCase().includes(origin.toLowerCase()) || (origin === 'all' && btn.textContent === 'All Roots')) {
                    btn.className = "origin-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition-all";
                } else {
                    btn.className = "origin-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";
                }
            });
            filterNames();
        }

        function setLengthFilter(lengthType) {
            currentLength = lengthType;
            document.querySelectorAll('.length-btn').forEach(btn => {
                if (btn.textContent.toLowerCase().includes(lengthType.toLowerCase()) || (lengthType === 'all' && btn.textContent === 'Any Length')) {
                    btn.className = "length-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition-all";
                } else {
                    btn.className = "length-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";
                }
            });
            filterNames();
        }

        function filterByLetter(letter) {
            currentLetter = letter;
            document.querySelectorAll('.letter-btn').forEach(btn => {
                if (btn.textContent === letter || (letter === 'all' && btn.textContent === 'All')) {
                    btn.className = "letter-btn px-2.5 py-1 rounded text-xs font-bold bg-indigo-600 text-white transition-all";
                } else {
                    btn.className = "letter-btn px-2.5 py-1 rounded text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";
                }
            });
            filterNames();
        }

        function switchTab(tab) {
            currentTab = tab;
            const allBtn = document.getElementById('allTabBtn');
            const favBtn = document.getElementById('favTabBtn');

            if (tab === 'all') {
                allBtn.className = "px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white shadow-sm transition-all";
                favBtn.className = "px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";
            } else {
                favBtn.className = "px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white shadow-sm transition-all";
                allBtn.className = "px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";
            }

            filterNames();
        }

        function toggleFavorite(nameString) {
            const item = babyNames.find(n => n.name === nameString);
            if (!item) return;

            const index = favorites.findIndex(fav => fav.name === nameString);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(item);
            }

            localStorage.setItem('baby_favorites', JSON.stringify(favorites));
            filterNames();
        }

        // Initialize App on Load
        initAlphabetBar();
        renderNames(babyNames);
    </script>
</body>
</html>
