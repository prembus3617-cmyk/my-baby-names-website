<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-100 py-6">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold text-indigo-600">BabyNameFinder</h1>
            <p class="text-slate-500 mt-1">Discover meaningful names, origins, and inspirations from A to Z.</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
        
        <!-- Search and Filters Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-8 space-y-4">
            <div>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by name, meaning, or origin (e.g., 'Aarav', 'Peace')..."

                    oninput="filterNames()"
                >
            </div>
            
            <div class="flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-2">
                    <button onclick="setGenderFilter('all')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 text-white transition-all">All</button>
                    <button onclick="setGenderFilter('Boy')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Boys</button>
                    <button onclick="setGenderFilter('Girl')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Girls</button>
                    <button onclick="setGenderFilter('Unisex')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Unisex</button>
                </div>
                
                <div class="text-sm text-slate-500">
                    Showing <span id="nameCount">0</span> names
                </div>
            </div>
        </div>

        <!-- Names Grid -->
        <div id="namesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dynamic Cards Populated via JS -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12">
            <p class="text-slate-400 text-lg">No matching names found. Try a different search term.</p>
        </div>

    </main>

        let currentGender = 'all';

        function renderNames(filteredList) {
            const grid = document.getElementById('namesGrid');
            const emptyState = document.getElementById('emptyState');
            const countSpan = document.getElementById('nameCount');
            
            grid.innerHTML = '';
            countSpan.textContent = filteredList.length;

            if (filteredList.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filteredList.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow flex flex-col justify-between";
                
                const badgeColor = item.gender === 'Boy' ? 'bg-blue-50 text-blue-600' : item.gender === 'Girl' ? 'bg-pink-50 text-pink-600' : 'bg-purple-50 text-purple-600';

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-xl font-bold text-slate-800">${item.name}</h3>
                            <span class="text-xs px-2.5 py-1 rounded-full font-medium ${badgeColor}">${item.gender}</span>
                        </div>
                        <p class="text-slate-600 text-sm mb-3">${item.meaning}</p>
                    </div>
                    <div class="text-xs text-slate-400 border-t border-slate-50 pt-2 flex justify-between">
                        <span>Origin: <strong class="text-slate-600">${item.origin}</strong></span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterNames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = babyNames.filter(item => {
                const matchesGender = currentGender === 'all' || item.gender === currentGender;
                const matchesSearch = item.name.toLowerCase().includes(query) || item.meaning.toLowerCase().includes(query) || item.origin.toLowerCase().includes(query);
                return matchesGender && matchesSearch;
            });

            renderNames(filtered);
        }

        function setGenderFilter(gender) {
            currentGender = gender;
            
            // Update button styles
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                if (btn.textContent.toLowerCase() === gender.toLowerCase() || (gender === 'all' && btn.textContent === 'All')) {
                    btn.className = "filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 text-white transition-all";
                } else {
                    btn.className = "filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";
                }
            });

            filterNames();
        }
